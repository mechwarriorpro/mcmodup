[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmodup"
version = "0.1.0"
description = "Plan and build standalone NeoForge 1.21.1 modpack updates"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
mcmodup = "mcmodup.__main__:main"

[tool.setuptools]
packages = ["mcmodup"]

[tool.setuptools.package-data]
mcmodup = ["templates/*", "templates/minechem/*.java", "templates/icbm_plate/*.java", "templates/atomic_thermometer/*.java", "templates/mimicry_catalyst/*.java", "templates/pack-ui/*", "templates/source-ports/*", "templates/gradle/*", "templates/gradle/wrapper/*"]
