name: Check original mods with Legacy Connector

on:
  push:
    paths:
      - '.github/workflows/connector-sanity.yml'
      - 'tests/connector_sanity.py'
      - 'tests/fixtures/ConnectorSmoke.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-mods:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact legacy inputs and start a disposable Thaumcraft GameTest server
        shell: bash
        run: |
          # Original inputs, translated classes and worlds are private runner scratch. No uploads.
          scratch="$(mktemp -d "$RUNNER_TEMP/connector.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
              --max-time 90 --max-filesize "$3" --output "$scratch/$2" "$1"
          }
          download https://github.com/kylepitcock/Legacy-Connector/releases/download/v0.5.0/legacyconnector-0.5.0.jar connector.jar 37681773
          download https://edge.forgecdn.net/files/2227/552/Thaumcraft-1.7.10-4.2.3.5.jar thaumcraft.jar 12565807
          download https://edge.forgecdn.net/files/2224/857/Baubles-1.7.10-1.0.1.10.jar baubles.jar 95415
          download https://github.com/iopleke/Minechem/releases/download/1.6.4-5.0.5-FINAL/Minechem-1.6.4-5.0.5.FINAL.jar minechem.jar 1410748
          download https://raw.githubusercontent.com/TechnicPack/Technic/8c4e20f9225bcd6612fca4cb29c53366317d3e13/servers/voltz/Voltz_Server_v3.0.0c.zip voltz.zip 76658094
          python -m connector_sanity --connector "$scratch/connector.jar" --thaumcraft "$scratch/thaumcraft.jar" \
            --baubles "$scratch/baubles.jar" --minechem "$scratch/minechem.jar" --voltz "$scratch/voltz.zip"
