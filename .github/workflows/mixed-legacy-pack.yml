name: Check the mixed legacy pack

on:
  workflow_dispatch:
    inputs:
      connector_oracle:
        description: Run the exact inputs through Legacy Connector instead of the native pack regression
        type: choice
        options: ['none', mixed, mimicry]
        default: 'none'
  push:
    paths:
      - '.github/workflows/mixed-legacy-pack.yml'
      - 'mcmodup/native_pack.py'
      - 'mcmodup/legacy_dependencies.py'
      - 'mcmodup/__main__.py'
      - 'mcmodup/convert.py'
      - 'mcmodup/machines.py'
      - 'mcmodup/method_ports.py'
      - 'mcmodup/minechem_pair.py'
      - 'mcmodup/source_ports.py'
      - 'mcmodup/templates/minechem/**'
      - 'tests/mixed_legacy_pack_smoke.py'
      - 'tests/minechem_pair_pack_smoke.py'
      - 'tests/neoforge_smoke.py'
      - 'tests/fixtures/CatalogSmoke.java'
      - 'tests/fixtures/MinechemPairChecks.java'
      - 'tests/fixtures/MultipartControlSmoke.java'

permissions:
  contents: read

jobs:
  mixed-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the stock target and pinned native controls
        id: target
        shell: bash
        run: |
          root="$RUNNER_TEMP/mixed-legacy-pack"
          mkdir -p "$root/target/mods"
          cd "$root"
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 2 --max-time 100 --max-filesize 12000000 --output "$1" "$2"
            printf '%s  %s\n' "$4" "$1" | "$3" --check
          }
          download installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.267/neoforge-21.1.267-installer.jar sha256sum 25bbe66e82205abeccdfd23bdac61e6a8e9ff1333885f3c9f31d392a5ec97e60
          java -jar installer.jar --installServer target > installer.log 2>&1 || { tail -75 installer.log; exit 1; }
          download target/mods/CBMultipart-1.21.1-3.5.0.155.jar https://cdn.modrinth.com/data/LmvnWWSV/versions/mhteXGK9/CBMultipart-1.21.1-3.5.0.155.jar sha512sum 43ba1480586db6fac554e4cf5ade2f006a789a509a32f0824277e35310831d3dc7b90cee08d7baf228bb74132174dd4e41d2b1ac9dd23f9877b0969b718fa303
          download target/mods/CodeChickenLib-1.21.1-4.6.1.526.jar https://cdn.modrinth.com/data/2gq0ALnz/versions/gQ1srSKh/CodeChickenLib-1.21.1-4.6.1.526.jar sha512sum 2d4efdc64531d5bb8133a247bc22a0728ab99dbcb2842ad0303b2242afd0ddc1b90cd43f8ed8562f651d8d9e228c95d15d73b4b63b3980286450de2df9c0e5ef
      - name: Pin the original archives and legacy dependency references
        shell: bash
        run: |
          root="$RUNNER_TEMP/mixed-legacy-pack"
          cd "$root"
          mkdir -p legacy/mods/{1.6.4,1.7.10}
          download() {
            echo "Fetching $1"
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 2 --max-time 120 --max-filesize "$5" --output "$1" "$2"
            printf '%s  %s\n' "$4" "$1" | "$3" --check
          }
          download voltz.zip https://raw.githubusercontent.com/TechnicPack/Technic/8c4e20f9225bcd6612fca4cb29c53366317d3e13/servers/voltz/Voltz_Server_v3.0.0c.zip sha256sum 2eda607746a22edbf45612243adce37a876251e36d46c692a48344fe98eec84e 76658094
          download legacy/mods/1.6.4/Minechem-1.6.4-5.0.5.FINAL.jar https://edge.forgecdn.net/files/2214/881/Minechem-1.6.4-5.0.5.FINAL.jar sha256sum 2443c7f91351f0e6c2323636be28a6fe8697704f20edf378dfe1a9d7a3070bea 1410748
          download legacy/mods/1.7.10/Minechem-1.7.10-5.0.5.394.jar https://edge.forgecdn.net/files/2230/655/Minechem-1.7.10-5.0.5.394.jar sha256sum ea802167b760d43828a0648de3727a58d5c1f7737613123ae49f2743188cdae7 1090147
          download legacy/mods/1.7.10/Thaumcraft-1.7.10-4.2.3.5.jar https://edge.forgecdn.net/files/2227/552/Thaumcraft-1.7.10-4.2.3.5.jar sha256sum 3dba9786966974701578a658d1bb369bf35bdf5f363079f5ac9c4910a39113be 12565807
          download legacy/mods/1.7.10/Baubles-1.7.10-1.0.1.10.jar https://edge.forgecdn.net/files/2224/857/Baubles-1.7.10-1.0.1.10.jar sha1sum b6e6ce2d0476d1d53686440f2fc70d2a27e289c2 95415
          download 'legacy/mods/1.7.10/CoFHLib-[1.7.10]1.0.1-151.jar' https://edge.forgecdn.net/files/2233/832/CoFHLib-%5b1.7.10%5d1.0.1-151.jar sha1sum 20617e7822e0217cd091867db681d940f682235b 271274
          download 'legacy/mods/1.6.4/Mimicry 1.6.4_965_1.3.9_final.zip' https://edge.forgecdn.net/files/2214/561/Mimicry%201.6.4_965_1.3.9_final.zip sha256sum 4a3d6e72be0ae0f8929c11890dcf96b49750db48908c5bd5b5957d2d9542eada 128106
          download legacy/mods/1.6.4/Random_Things_v._1.9__MC_1.6.4_.jar https://edge.forgecdn.net/files/787/782/Random_Things_v._1.9__MC_1.6.4_.jar sha256sum cc3b350aed5a41b48da68ebcea27cb156c4eed6347bf060bbdbb00b5109faa49 1396811
          # Paired originals from FTB's Monster 1.1.2 manifest (pack 66, version 194).
          download 'legacy/mods/1.6.4/GeoStrata 1.6 v23b.zip' https://dist.modpacks.ch/Reika/GeoStrata/Gamma/a4c4318549d1ac6de878c5dce95ac9fa3f55dbb6 sha256sum afd68aa6ca1222a0f53ee25323c18bd3c2473c346a15345b216c9ef1042a0414 1138465
          download 'legacy/mods/1.6.4/DragonAPI 1.6 v23b.zip' https://dist.modpacks.ch/Reika/DragonAPI/release/2dbd889f480fe39c094575c8045b4f4652a33aa3 sha1sum 2dbd889f480fe39c094575c8045b4f4652a33aa3 1209419
      - name: Run the updater on the whole original selection
        if: ${{ inputs.connector_oracle == '' || inputs.connector_oracle == 'none' }}
        run: python -m mixed_legacy_pack_smoke "$RUNNER_TEMP/mixed-legacy-pack" originals
      - name: Run the unchanged Multipart and CodeChickenLib control separately
        if: ${{ !cancelled() && steps.target.outcome == 'success' && (inputs.connector_oracle == '' || inputs.connector_oracle == 'none') }}
        run: python -m mixed_legacy_pack_smoke "$RUNNER_TEMP/mixed-legacy-pack" control
      - name: Stage both linked Minechem previews and run the staged JARs
        if: ${{ inputs.connector_oracle == '' || inputs.connector_oracle == 'none' }}
        run: python -m minechem_pair_pack_smoke "$RUNNER_TEMP/mixed-legacy-pack"
      - name: Run the exact-input Legacy Connector oracle (not a native pack)
        if: ${{ inputs.connector_oracle == 'mixed' || inputs.connector_oracle == 'mimicry' }}
        env:
          ORACLE: ${{ inputs.connector_oracle }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/mixed-legacy-pack"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            --retry 2 --max-time 90 --max-filesize 37681773 --output "$root/connector.jar" \
            https://github.com/kylepitcock/Legacy-Connector/releases/download/v0.5.0/legacyconnector-0.5.0.jar
          python -m connector_mixed_smoke "$root" "$ORACLE"
