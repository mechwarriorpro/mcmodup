name: Compare exact Minechem releases on Forge

on:
  workflow_dispatch:
    inputs:
      capture_chemistry:
        type: boolean
        default: false
        description: Include compressed raw chemistry observations in job annotations
  push:
    paths:
      - '.github/workflows/minechem-original-parity.yml'
      - 'mcmodup/machines.py'
      - 'mcmodup/minechem_final_synthesis.py'
      - 'mcmodup/templates/minechem/final-*.txt'
      - 'mcmodup/minechem_materials.py'
      - 'mcmodup/minechem_effects.py'
      - 'mcmodup/minechem_polytool.py'
      - 'mcmodup/minechem_matter.py'
      - 'mcmodup/templates/minechem/release394-*.txt'
      - 'tests/minechem_original_smoke.py'
      - 'tests/fixtures/LegacyMinechemDecomposer.java'
      - 'tests/fixtures/LegacyMinechemMaterials.java'
      - 'tests/fixtures/LegacyMinechemChemistry.java'
      - 'tests/fixtures/LegacyMinechemPolytool.java'
      - 'tests/fixtures/LegacyMinechemMatter.java'
      - 'tests/fixtures/LegacyMinechemPlayerDecay.java'
      - 'tests/fixtures/LegacyMinechemOre.java'
      - 'tests/fixtures/LegacyMinechemFluidAutomation.java'
      - 'tests/fixtures/LegacyMinechemSynthesis394.java'
      - 'tests/fixtures/LegacyMinechemSynthesisFinal.java'
      - 'tests/fixtures/LegacyMinechemJournal394.java'
      - 'tests/fixtures/LegacyMinechemReactors.java'
      - 'mcmodup/templates/minechem/reactor-blueprints.txt'
      - 'tests/legacy_recipe_fixture.py'

permissions:
  contents: read

jobs:
  original:
    name: Minechem on Forge ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        minecraft: [1.6.4, 1.7.10]
    env:
      PYTHONPATH: .:tests
      MCMODUP_CAPTURE_CHEMISTRY: ${{ inputs.capture_chemistry && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.minecraft == '1.7.10'
        with:
          distribution: temurin
          java-version: '8'
      - name: Download pinned Java 7 for FINAL and the .394 decay replay
        shell: bash
        run: |
          root="$RUNNER_TEMP/minechem"
          mkdir -p "$root"
          cd "$root"
          jdk=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            --retry 2 --max-time 120 --max-filesize 68604442 -o "$jdk.tar.gz" "https://cdn.azul.com/zulu/bin/$jdk.tar.gz"
          printf '%s  %s\n' 8a7387c1ed151474301b6553c6046f865dc6c1e1890bcf106acc2780c55727c8 "$jdk.tar.gz" | sha256sum --check
          tar -xf "$jdk.tar.gz"
          echo "JAVA_HOME=$root/$jdk" >> "$GITHUB_ENV"
      - name: Download exact Minechem FINAL and Voltz runtime
        if: matrix.minecraft == '1.6.4'
        shell: bash
        run: |
          root="$RUNNER_TEMP/minechem"
          mkdir -p "$root/original/mods"
          cd "$root"
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
              --retry 2 --max-time 120 --max-filesize "$4" -o "$1" "$2"
            printf '%s  %s\n' "$3" "$1" | sha256sum --check
          }
          download voltz.zip https://raw.githubusercontent.com/TechnicPack/Technic/8c4e20f9225bcd6612fca4cb29c53366317d3e13/servers/voltz/Voltz_Server_v3.0.0c.zip 2eda607746a22edbf45612243adce37a876251e36d46c692a48344fe98eec84e 76658094
          download original/mods/Minechem-1.6.4-5.0.5.FINAL.jar https://edge.forgecdn.net/files/2214/881/Minechem-1.6.4-5.0.5.FINAL.jar 2443c7f91351f0e6c2323636be28a6fe8697704f20edf378dfe1a9d7a3070bea 1410748
      - name: Download exact Minechem .394 with Forge and CoFHLib
        if: matrix.minecraft == '1.7.10'
        shell: bash
        run: |
          root="$RUNNER_TEMP/minechem"
          mkdir -p "$root/original/mods" "$root/original/bin"
          cd "$root"
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
              --retry 2 --max-time 100 --max-filesize "$5" -o "$1" "$2"
            printf '%s  %s\n' "$4" "$1" | "$3" --check
          }
          download original/mods/Minechem-1.7.10-5.0.5.394.jar https://edge.forgecdn.net/files/2230/655/Minechem-1.7.10-5.0.5.394.jar sha256sum ea802167b760d43828a0648de3727a58d5c1f7737613123ae49f2743188cdae7 1090147
          download 'CoFHLib-[1.7.10]1.0.1-151.jar' https://edge.forgecdn.net/files/2233/832/CoFHLib-%5b1.7.10%5d1.0.1-151.jar sha1sum 20617e7822e0217cd091867db681d940f682235b 271274
          # The original release tag builds against 1291; its fluid registration fails on 1360.
          download original/bin/modpack.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.2.1291/forge-1.7.10-10.13.2.1291-universal.jar sha1sum e992c65ece8fd396c6b36ffffa4965c1ebb96ffd 4000000
      - name: Run the original recipe through power, ticks and a buffer save round trip
        run: python -m minechem_original_smoke "$RUNNER_TEMP/minechem" '${{ matrix.minecraft }}'
      - name: Replay .394 radioactive molecules and fluid containers under Java 7
        if: matrix.minecraft == '1.7.10'
        shell: bash
        run: |
          root="$RUNNER_TEMP/minechem"
          mkdir "$root/matter"
          cp -r "$root/original" "$root/CoFHLib-[1.7.10]1.0.1-151.jar" "$root/matter/"
          python -m minechem_original_smoke "$root/matter" 1.7.10 --matter-only
