name: Verify local pack compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pack-compatibility.yml'
      - 'mcmodup/*pack*.py'
      - 'mcmodup/runtime.py'
      - 'mcmodup/legacy_dependencies.py'
      - 'mcmodup/native_resolution.py'
      - 'mcmodup/private_libraries.py'
      - 'mcmodup/versions.py'
      - 'tests/*pack*compatibility*.py'
      - 'tests/pack_release_smoke.py'
      - 'tests/fixtures/EnergisticsPackSmoke.java'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test pack planning and execute two isolated library versions
        run: python -m unittest discover -s tests -p test_pack_compatibility.py -v
      - name: Prepare exact local release inputs and install a clean NeoForge server
        shell: bash
        run: |
          root="$RUNNER_TEMP/pack-compatibility"
          cd "$RUNNER_TEMP"
          mkdir -p "$root" "$root/old/bin" "$root/old/mods/1.7.10/addons" "$root/old/coremods" "$root/server/lib"
          cd "$root"
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 2 --max-time 100 --max-filesize 32000000 --output "$1" "$2"
            if [[ $# -gt 2 ]]; then printf '%s  %s\n' "$4" "$1" | "$3" --check; fi
          }
          # Read-only legacy references; the installer and modern release JARs alone are executed.
          download old/bin/minecraft.jar https://piston-data.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar sha1sum e80d9b3bf5085002218d4be59e668bac718abbc6
          download old/bin/modpack.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-universal.jar sha1sum 25fd97f72beca728112256938e03e8105b1b78cc
          download old/mods/1.7.10/addons/thaumicenergistics-1.1.3.0.jar https://edge.forgecdn.net/files/2563/527/thaumicenergistics-1.1.3.0.jar
          download old/mods/1.7.10/appliedenergistics2-rv3-beta-6.jar https://edge.forgecdn.net/files/2296/430/appliedenergistics2-rv3-beta-6.jar
          download old/mods/1.7.10/Thaumcraft-1.7.10-4.2.3.5.jar https://edge.forgecdn.net/files/2227/552/Thaumcraft-1.7.10-4.2.3.5.jar
          download old/coremods/ForgeMultipart-1.7.10-1.2.0.345-universal.jar https://edge.forgecdn.net/files/2242/993/ForgeMultipart-1.7.10-1.2.0.345-universal.jar
          # Deliberately use local candidates, not a network-aware updater. No JARs are uploaded.
          download server/lib/thaumic-energistics-reforged-1.1-1.21.1.jar https://github.com/Incoderr/thaumic-energistics-reforged/releases/download/1.21.1/thaumic-energistics-reforged-1.1-1.21.1.jar sha256sum a9bb655da8e0140ede96dfe076fb57f1c02e982ae068110569daa52ef8af97c9
          download server/lib/thaumcraft-4-reforged-1.1.3-1.21.1.jar https://github.com/Incoderr/thaumcraft-4-reforged/releases/download/1.21.1/thaumcraft-4-reforged-1.1.3-1.21.1.jar sha256sum 9228c094f656a4823e5a5f798e81030d7f98efd5a702dc1bb6d6fe69025cf844
          download server/lib/appliedenergistics2-19.2.18.jar https://github.com/AppliedEnergistics/Applied-Energistics-2/releases/download/neoforge%2Fv19.2.18/appliedenergistics2-19.2.18.jar sha256sum df15a07f86ca1ca93aa66373f9d5d84dd3d4586631fceb38f4fbc85dad591e39
          download server/lib/guideme-21.1.22.jar https://github.com/AppliedEnergistics/GuideME/releases/download/v21.1.22/guideme-21.1.22.jar sha256sum 108337ff98c706b18ed2fbec077b3337ba72c08f8b46a273534886280e89ef0d
          download server/lib/curios-neoforge-9.5.1+1.21.1.jar https://cdn.modrinth.com/data/vvuO3ImH/versions/yohfFbgD/curios-neoforge-9.5.1%2B1.21.1.jar sha512sum 5981a267686b744e7e3c227f78cbcd5267c14ac6979a28e814695f4589273998563147207fef4a5cdb7cdbdc39797cd95d9e4abadb55869f18e02a38d0654ae5
          download server/lib/TerraBlender-neoforge-1.21.1-4.1.0.8.jar https://cdn.modrinth.com/data/kkmrDlKT/versions/6e8GCrLb/TerraBlender-neoforge-1.21.1-4.1.0.8.jar sha512sum 9d4b2a1be5139c0fb2fad92ed21805b17d9e83b6ea48e637e018bb14063c1823a206390755dbfe8d025c20fd62ac11cdd84db53ddb956dabaeda01bff57bac50
          download server/lib/CBMultipart-1.21.1-3.5.0.155.jar https://cdn.modrinth.com/data/LmvnWWSV/versions/mhteXGK9/CBMultipart-1.21.1-3.5.0.155.jar sha512sum 43ba1480586db6fac554e4cf5ade2f006a789a509a32f0824277e35310831d3dc7b90cee08d7baf228bb74132174dd4e41d2b1ac9dd23f9877b0969b718fa303
          download server/lib/CodeChickenLib-1.21.1-4.6.1.526.jar https://cdn.modrinth.com/data/2gq0ALnz/versions/gQ1srSKh/CodeChickenLib-1.21.1-4.6.1.526.jar sha512sum 2d4efdc64531d5bb8133a247bc22a0728ab99dbcb2842ad0303b2242afd0ddc1b90cd43f8ed8562f651d8d9e228c95d15d73b4b63b3980286450de2df9c0e5ef
          printf '%s\n' '{"appliedenergistics2":"ae2","ForgeMultipart":"cb_multipart","ForgeMicroblock":"cb_microblock","McMultipart":"cb_multipart_minecraft"}' > ids.json
          download installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.267/neoforge-21.1.267-installer.jar sha256sum 25bbe66e82205abeccdfd23bdac61e6a8e9ff1333885f3c9f31d392a5ec97e60
          java -jar installer.jar --installServer server > install.log 2>&1 || { tail -75 install.log; exit 1; }
      - name: Stage a new instance, boot it, and exercise AE2 essentia storage and CB Microblocks
        shell: bash
        run: |
          log="$RUNNER_TEMP/pack-compatibility/checks.log"
          if ! PYTHONPATH=.:tests python -m pack_release_smoke "$RUNNER_TEMP/pack-compatibility" > "$log" 2>&1; then
            cat "$log"
            python - "$log" <<'PY'
          import pathlib
          import sys
          detail = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-7000:]
          print("::error title=Pack compatibility check failed::" + detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          cat "$log"
