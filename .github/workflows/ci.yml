name: Test and build NeoForge ports

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test the CLI, decompiler, and generated NeoForge mods
        shell: bash
        run: |
          echo '::group::Download pinned decompilation tools'
          jar="$RUNNER_TEMP/vineflower-1.12.0.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --output "$jar" https://github.com/Vineflower/vineflower/releases/download/1.12.0/vineflower-1.12.0.jar
          printf '%s  %s\n' 1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d "$jar" | sha256sum --check
          remapper="$RUNNER_TEMP/SpecialSource-1.11.6-shaded.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --output "$remapper" https://repo.maven.apache.org/maven2/net/md-5/SpecialSource/1.11.6/SpecialSource-1.11.6-shaded.jar
          printf '%s  %s\n' afabcba81cd474c5b21abdfe1bbc3888f70a32e782c03bffe13510078fa45a26 "$remapper" | sha256sum --check
          echo '::endgroup::'
          command -v javac
          MCMODUP_VINEFLOWER_JAR="$jar" MCMODUP_SPECIALSOURCE_JAR="$remapper" \
            python -m unittest discover -s tests -p test_mapped_port.py -v
          echo '::notice title=Mapped source checked::Real SpecialSource and Vineflower remapped raw and SRG class, field and method names before decompilation.'
          log="$RUNNER_TEMP/mcmodup-tests.log"
          if ! MCMODUP_TEST_CONVERT_BUILD=1 MCMODUP_VINEFLOWER_JAR="$jar" MCMODUP_SPECIALSOURCE_JAR="$remapper" \
            python -m unittest discover -s tests -v 2>&1 | tee "$log"; then
            python - "$log" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          print("::error title=Test failures::" + log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
      - name: Verify Atomic Science and ICBM dependency examples against the original Voltz pack
        shell: bash
        run: |
          # Read pack and class bytes only; don't launch or upload any of these inputs or references.
          archive="$RUNNER_TEMP/Voltz_Server_v3.0.0c.zip"
          # Prefer the pinned raw object over the rate-limited unauthenticated API.
          options=(--proto '=https' --proto-redir '=https' --fail --location --retry 2
                   --max-time 90 --max-filesize 76658094 --output "$archive")
          if ! curl "${options[@]}" \
            https://raw.githubusercontent.com/TechnicPack/Technic/8c4e20f9225bcd6612fca4cb29c53366317d3e13/servers/voltz/Voltz_Server_v3.0.0c.zip; then
            curl "${options[@]}" --header 'Accept: application/vnd.github.raw+json' \
              https://api.github.com/repos/TechnicPack/Technic/git/blobs/359f4e1909c4c91511dc32bef4364f11b0cf07f9
          fi
          MCMODUP_VOLTZ_ARCHIVE="$archive" MCMODUP_VINEFLOWER_JAR="$RUNNER_TEMP/vineflower-1.12.0.jar" \
            python -m unittest discover -s tests -p test_voltz.py -v
      - name: Verify mapped decompilation on the original Atomic Science in Voltz
        shell: bash
        run: |
          # Read the pinned Forge configuration only. Do not run MCP or upload the config/derived Java.
          scratch="$(mktemp -d "$RUNNER_TEMP/mapped-voltz.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          ref=f1b3381e61fac1a0ae90f521223c6bc613eb4888
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --max-time 60 --max-filesize 33554432 --output "$scratch/fml.zip" \
            "https://codeload.github.com/MinecraftForge/FML/zip/$ref"
          unzip -q -j "$scratch/fml.zip" "FML-$ref/conf/"{version.cfg,joined.srg,methods.csv,fields.csv,packages.csv} -d "$scratch/conf"
          if ! python -m mcmodup decompile-mod "$RUNNER_TEMP/Voltz_Server_v3.0.0c.zip" \
            --mod mods/atomicscience.jar --source-version 1.6.4 --mcp "$scratch/conf" \
            --specialsource "$RUNNER_TEMP/SpecialSource-1.11.6-shaded.jar" --vineflower "$RUNNER_TEMP/vineflower-1.12.0.jar" \
            --class atomicscience.fission.BlockUraniumOre -o "$scratch/mapped" > "$scratch/decompile.log" 2>&1; then
            python - "$scratch/decompile.log" <<'PY'
          import pathlib
          import sys
          error = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-2500:]
          print("::error title=Historical mapping failed::" + error.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          python - "$scratch/mapped" <<'PY'
          import json
          import pathlib
          import sys
          out = pathlib.Path(sys.argv[1])
          report = json.loads((out / "decompile-report.json").read_text())
          def require(condition, reason):
              if not condition:
                  print(f"::error title=Historical mapping failed::{reason}")
                  raise SystemExit(1)
          require(report["mcp"]["minecraft"] == "1.6.4", "Wrong MCP release")
          require(report["mod"]["sha256"] == "80cf5bd9d485377ecde3822154a5db47804fab3e8f78c388cfcf529239655938", "Wrong original JAR")
          require(report["source_files"] == ["atomicscience/fission/BlockUraniumOre.java"], "Wrong selected class output")
          source = (out / "sources" / report["source_files"][0]).read_text()
          missing = [name for name in ("randomDisplayTick", "setHardness", "blockIcon") if name not in source]
          require(not missing, f"MCP names absent from the Java: {', '.join(missing)}")
          require(not report["remaining_srg_symbols"], f"{len(report['remaining_srg_symbols'])} visible SRG symbols remained")
          require(not list(out.rglob("*.jar")), "Unexpected binary in decompilation output")
          print("::notice title=Historical mapping checked::The exact Voltz Atomic Science class used MCP 8.11 names for both inherited methods and fields. No originals or references were published.")
          PY
      - name: Check machine recipe recovery on the historical Minechem release
        shell: bash
        run: |
          jar="$RUNNER_TEMP/Minechem-1.6.4-5.0.5.FINAL.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --output "$jar" https://github.com/iopleke/Minechem/releases/download/1.6.4-5.0.5-FINAL/Minechem-1.6.4-5.0.5.FINAL.jar
          printf '%s  %s\n' 2443c7f91351f0e6c2323636be28a6fe8697704f20edf378dfe1a9d7a3070bea "$jar" | sha256sum --check
          # Inspect/adapt data only. Do not run or upload the original JAR.
          python -m mcmodup convert-jar "$jar" --pack "$RUNNER_TEMP/Voltz_Server_v3.0.0c.zip" --profile minechem-chemistry --allow-partial \
            -o "$RUNNER_TEMP/minechem-chemistry-test-only.jar"
          python - "$RUNNER_TEMP/minechem-chemistry-test-only.jar" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              catalog = json.loads(jar.read("data/minechem_chemistry/mcmodup/catalog.json"))
              assert sum("atomic_number" in item for item in catalog["entries"]) == 113
              assert sum(item["new_id"].startswith("minechem_chemistry:molecule_") for item in catalog["entries"]) == 147
              assert any(item["new_id"] == "minechem_chemistry:molecule_water" and item["recipe_status"] == "powered_synthesis"
                         for item in catalog["entries"])
              recipes = len(catalog["machine_recipes"])
              assert recipes == 299
              assert catalog["decomposer_mode"] == "5.0.5-final-output-buffer" and not catalog["full_port"]
              print(f"::notice title=Minechem catalog and buffer mode checked::113 elements, 147 molecules, {recipes} machine recipes")
          PY
      - name: Build a separate partial decomposer from Minechem .394
        shell: bash
        run: |
          jar="$RUNNER_TEMP/Minechem-1.7.10-5.0.5.394.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --max-time 100 --max-filesize 1090147 --output "$jar" \
            https://edge.forgecdn.net/files/2230/655/Minechem-1.7.10-5.0.5.394.jar
          printf '%s  %s\n' ea802167b760d43828a0648de3727a58d5c1f7737613123ae49f2743188cdae7 "$jar" | sha256sum --check
          # Keep both inputs and generated partial JARs in runner scratch (no uploads).
          log="$RUNNER_TEMP/minechem-394-build.log"
          if ! python -m mcmodup convert-jar "$jar" --pack "$jar" --profile minechem-chemistry-394 --allow-partial \
            -o "$RUNNER_TEMP/minechem-394-test-only.jar" > "$log" 2>&1; then
            python - "$log" <<'PY'
          import pathlib
          import sys
          output = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-4000:]
          print("::error title=Minechem .394 build failed::" + output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          cat "$log"
      - name: Verify catalog recovery on the official Thaumcraft 4 release
        shell: bash
        run: |
          # The original and the adapted JAR are only used in runner scratch. Never upload either.
          scratch="$(mktemp -d "$RUNNER_TEMP/thaumcraft-check.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          jar="$scratch/Thaumcraft-1.7.10-4.2.3.5.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --max-time 60 --max-filesize 12565807 --output "$jar" \
            https://edge.forgecdn.net/files/2227/552/Thaumcraft-1.7.10-4.2.3.5.jar
          test "$(wc -c < "$jar")" -eq 12565807
          if ! python -m mcmodup convert-jar "$jar" --pack "$jar" --profile thaumcraft-aspects --allow-partial \
            -o "$scratch/test-only.jar" > "$scratch/test.log" 2>&1; then
            python - "$scratch/test.log" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[:2000]
          print("::error title=Thaumcraft check failed::" + log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          python - "$scratch/test-only.jar" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              catalog = json.loads(jar.read("data/thaumcraft_aspects/mcmodup/catalog.json"))
              assert any(item["tag"] == "lux" and item["components"] == ["aer", "ignis"]
                         and item["recipe_status"] == "crafting_shapeless" for item in catalog["entries"])
              recipes = sum(item["recipe_status"] == "crafting_shapeless" for item in catalog["entries"])
              print(f"::notice title=Thaumcraft catalog verified::{len(catalog['entries'])} aspects, {recipes} crafting recipes")
          PY
          # Test the pair alongside the same untouched native builds as the mixed pack.
          # neoforge_smoke verifies both SHA-512 pins before placing either on a classpath.
          controls=(CBMultipart-1.21.1-3.5.0.155.jar CodeChickenLib-1.21.1-4.6.1.526.jar)
          options=(--proto '=https' --proto-redir '=https' --fail --location --retry 2 --max-time 60 --max-filesize 12000000)
          curl "${options[@]}" -o "$scratch/${controls[0]}" "https://cdn.modrinth.com/data/LmvnWWSV/versions/mhteXGK9/${controls[0]}"
          curl "${options[@]}" -o "$scratch/${controls[1]}" "https://cdn.modrinth.com/data/2gq0ALnz/versions/gQ1srSKh/${controls[1]}"
          log="$scratch/runtime.log"
          if ! PYTHONPATH=.:tests python -m neoforge_smoke "$RUNNER_TEMP/minechem-chemistry-test-only.jar" \
            "$scratch/test-only.jar" --minechem-394 "$RUNNER_TEMP/minechem-394-test-only.jar" \
            --multipart-control "$scratch/${controls[0]}" "$scratch/${controls[1]}" > "$log" 2>&1; then
            python - "$log" <<'PY'
          import pathlib
          import sys
          output = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-5000:]
          print("::error title=Release-derived NeoForge checks failed::" + output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          cat "$log"
          echo '::notice title=Official release smoke tests passed::The release-derived JARs passed Minechem machine and Thaumcraft aspect tests on NeoForge.'
      - name: Generate the demo project
        run: python -m mcmodup port examples/retro-ruby -o ports/retro-ruby --plain-item ruby
      - name: Build the NeoForge 1.21.1 demo
        working-directory: ports/retro-ruby
        run: ./gradlew --no-daemon build
      - name: Play a staged native base and add-on without Legacy Connector
        shell: bash
        run: |
          PYTHONPATH=.:tests python -m native_pack_smoke ports/retro-ruby/build/libs/*.jar
          echo '::notice title=Native updater runtime passed::The staged base, add-on and auto-selected library passed GameTest with no Legacy Connector.'
      - name: Build source ports and play the newly built base and add-on
        shell: bash
        run: |
          log="$RUNNER_TEMP/mcmodup-source-build-test.log"
          if ! PYTHONPATH=.:tests python -m source_pack_smoke 2>&1 | tee "$log"; then
            python - "$log" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-5200:]
          print("::error title=Source build smoke failed::" + log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          echo '::notice title=Source build smoke passed::Built the base and its add-on from pinned source ZIPs, used the pack-local library, audited the legacy assets, and passed a GameTest on the staged JARs.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neoforge-1.21.1-retro-ruby-demo
          path: ports/retro-ruby/build/libs/*.jar
          if-no-files-found: error
