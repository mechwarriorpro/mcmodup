name: Test and build NeoForge demo

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test the CLI and bytecode indexes
        run: python -m unittest discover -s tests -v
      - name: Generate the demo project
        run: python -m mcmodup port examples/retro-ruby -o ports/retro-ruby --plain-item ruby
      - name: Build the NeoForge 1.21.1 demo
        working-directory: ports/retro-ruby
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neoforge-1.21.1-retro-ruby-demo
          path: ports/retro-ruby/build/libs/*.jar
          if-no-files-found: error
