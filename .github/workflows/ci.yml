name: Test and build NeoForge ports

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test the CLI, decompiler, and generated NeoForge mods
        shell: bash
        run: |
          echo '::group::Download pinned test decompiler'
          jar="$RUNNER_TEMP/vineflower-1.12.0.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --output "$jar" https://github.com/Vineflower/vineflower/releases/download/1.12.0/vineflower-1.12.0.jar
          printf '%s  %s\n' 1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d "$jar" | sha256sum --check
          echo '::endgroup::'
          log="$RUNNER_TEMP/mcmodup-tests.log"
          if ! MCMODUP_TEST_CONVERT_BUILD=1 MCMODUP_VINEFLOWER_JAR="$jar" python -m unittest discover -s tests -v 2>&1 | tee "$log"; then
            python - "$log" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          print("::error title=Test failures::" + log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
      - name: Verify Atomic Science and ICBM dependency examples against the original Voltz pack
        shell: bash
        run: |
          # Read pack and class bytes only; don't launch or upload any of these inputs or references.
          archive="$RUNNER_TEMP/Voltz_Server_v3.0.0c.zip"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --max-time 90 --max-filesize 76658094 --header 'Accept: application/vnd.github.raw+json' \
            --output "$archive" https://api.github.com/repos/TechnicPack/Technic/git/blobs/359f4e1909c4c91511dc32bef4364f11b0cf07f9
          MCMODUP_VOLTZ_ARCHIVE="$archive" MCMODUP_VINEFLOWER_JAR="$RUNNER_TEMP/vineflower-1.12.0.jar" \
            python -m unittest discover -s tests -p test_voltz.py -v
      - name: Check machine recipe recovery on the historical Minechem release
        shell: bash
        run: |
          jar="$RUNNER_TEMP/Minechem-1.6.4-5.0.5.FINAL.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --output "$jar" https://github.com/iopleke/Minechem/releases/download/1.6.4-5.0.5-FINAL/Minechem-1.6.4-5.0.5.FINAL.jar
          printf '%s  %s\n' fd14166ff62e11701978c468976980f2 "$jar" | md5sum --check
          # Inspect/adapt data only. Do not run or upload the historical JAR or the adaptation.
          sha256sum "$jar"
          python -m mcmodup convert-jar "$jar" --pack "$RUNNER_TEMP/Voltz_Server_v3.0.0c.zip" --profile minechem-chemistry --allow-partial \
            -o "$RUNNER_TEMP/minechem-chemistry-test-only.jar"
          python - "$RUNNER_TEMP/minechem-chemistry-test-only.jar" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              catalog = json.loads(jar.read("data/minechem_chemistry/mcmodup/catalog.json"))
              assert sum("atomic_number" in item for item in catalog["entries"]) == 113
              assert sum(item["new_id"].startswith("minechem_chemistry:molecule_") for item in catalog["entries"]) == 147
              assert any(item["new_id"] == "minechem_chemistry:molecule_water" and item["recipe_status"] == "powered_synthesis"
                         for item in catalog["entries"])
              recipes = len(catalog["machine_recipes"])
              assert recipes == 299
              print(f"::notice title=Minechem port checked::113 elements, 147 molecules, {recipes} machine recipes")
          PY
      - name: Verify catalog recovery on the official Thaumcraft 4 release
        shell: bash
        run: |
          # The original and the adapted JAR are only used in runner scratch. Never upload either.
          scratch="$(mktemp -d "$RUNNER_TEMP/thaumcraft-check.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          jar="$scratch/Thaumcraft-1.7.10-4.2.3.5.jar"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --max-time 60 --max-filesize 12565807 --output "$jar" \
            https://edge.forgecdn.net/files/2227/552/Thaumcraft-1.7.10-4.2.3.5.jar
          test "$(wc -c < "$jar")" -eq 12565807
          if ! python -m mcmodup convert-jar "$jar" --pack "$jar" --profile thaumcraft-aspects --allow-partial \
            -o "$scratch/test-only.jar" > "$scratch/test.log" 2>&1; then
            python - "$scratch/test.log" <<'PY'
          import pathlib
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")[:2000]
          print("::error title=Thaumcraft check failed::" + log.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          fi
          python - "$scratch/test-only.jar" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              catalog = json.loads(jar.read("data/thaumcraft_aspects/mcmodup/catalog.json"))
              assert any(item["tag"] == "lux" and item["components"] == ["aer", "ignis"]
                         and item["recipe_status"] == "crafting_shapeless" for item in catalog["entries"])
              recipes = sum(item["recipe_status"] == "crafting_shapeless" for item in catalog["entries"])
              print(f"::notice title=Thaumcraft catalog verified::{len(catalog['entries'])} aspects, {recipes} crafting recipes")
          PY
          PYTHONPATH=.:tests python -m neoforge_smoke \
            "$RUNNER_TEMP/minechem-chemistry-test-only.jar" "$scratch/test-only.jar"
          echo '::notice title=Official release smoke tests passed::The release-derived JARs passed Minechem machine and Thaumcraft aspect tests on NeoForge.'
      - name: Generate the demo project
        run: python -m mcmodup port examples/retro-ruby -o ports/retro-ruby --plain-item ruby
      - name: Build the NeoForge 1.21.1 demo
        working-directory: ports/retro-ruby
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neoforge-1.21.1-retro-ruby-demo
          path: ports/retro-ruby/build/libs/*.jar
          if-no-files-found: error
