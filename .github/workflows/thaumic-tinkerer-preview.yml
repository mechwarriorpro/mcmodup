name: Check experimental native Thaumic Tinkerer pair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/thaumic-tinkerer-preview.yml'
      - '.github/workflows/thaumcraft-source-preview.yml'
      - 'mcmodup/tinkerer_port.py'
      - 'mcmodup/tinkerer_computercraft.py'
      - 'mcmodup/builtin_ports.py'
      - 'mcmodup/__main__.py'
      - 'mcmodup/source_ports.py'
      - 'mcmodup/native_pack.py'
      - 'pyproject.toml'
      - 'tests/thaumcraft_pack_smoke.py'
      - 'mcmodup/templates/source-ports/**'
      - 'tests/fixtures/Thaumcraft*Smoke.java'
      - 'tests/fixtures/ThaumcraftFlatPreset.json'
      - 'tests/fixtures/TinkererPackSmoke.java'
      - 'tests/fixtures/Ender*PackSmoke.java'
      - 'tests/neoforge_smoke.py'

permissions:
  contents: read

jobs:
  candidate:
    uses: ./.github/workflows/thaumcraft-source-preview.yml
    with:
      with-tinkerer: true
      with-computercraft: true
      with-ender-storage: true
