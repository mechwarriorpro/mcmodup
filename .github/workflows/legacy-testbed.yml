name: Build the single NeoForge legacy testbed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-testbed.yml'
      - 'mcmodup/legacy_testbed.py'
      - 'mcmodup/__main__.py'
      - 'mcmodup/minechem_pair.py'
      - 'mcmodup/icbm_plate.py'
      - 'mcmodup/atomic_thermometer.py'
      - 'mcmodup/geostrata_rocks.py'
      - 'mcmodup/templates/minechem/**'
      - 'mcmodup/templates/icbm_plate/**'
      - 'mcmodup/templates/atomic_thermometer/**'
      - 'mcmodup/templates/geostrata_rocks/**'
      - 'tests/legacy_testbed_smoke.py'
      - 'tests/test_legacy_testbed.py'

permissions:
  contents: read

jobs:
  testbed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned inputs and boot only the combined production JAR
        env:
          PYTHONPATH: .:tests
        shell: bash
        run: |
          root="$RUNNER_TEMP/legacy-testbed"
          mkdir "$root"
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 3 --max-time 120 --max-filesize "$4" --output "$root/$1" "$2"
            printf '%s  %s\n' "$3" "$root/$1" | sha256sum --check
          }
          download voltz.zip https://raw.githubusercontent.com/TechnicPack/Technic/8c4e20f9225bcd6612fca4cb29c53366317d3e13/servers/voltz/Voltz_Server_v3.0.0c.zip 2eda607746a22edbf45612243adce37a876251e36d46c692a48344fe98eec84e 76658094
          download Minechem-1.6.4-5.0.5.FINAL.jar https://edge.forgecdn.net/files/2214/881/Minechem-1.6.4-5.0.5.FINAL.jar 2443c7f91351f0e6c2323636be28a6fe8697704f20edf378dfe1a9d7a3070bea 1410748
          download Minechem-1.7.10-5.0.5.394.jar https://edge.forgecdn.net/files/2230/655/Minechem-1.7.10-5.0.5.394.jar ea802167b760d43828a0648de3727a58d5c1f7737613123ae49f2743188cdae7 1090147
          download 'GeoStrata 1.6 v23b.zip' https://dist.modpacks.ch/Reika/GeoStrata/Gamma/a4c4318549d1ac6de878c5dce95ac9fa3f55dbb6 afd68aa6ca1222a0f53ee25323c18bd3c2473c346a15345b216c9ef1042a0414 1138465
          download installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.267/neoforge-21.1.267-installer.jar 25bbe66e82205abeccdfd23bdac61e6a8e9ff1333885f3c9f31d392a5ec97e60 12000000
          java -jar "$root/installer.jar" --installServer "$root/server" > "$root/installer.log" 2>&1 || { tail -75 "$root/installer.log"; exit 1; }
          python -m legacy_testbed_smoke "$root"
          # Do not publish private-use GeoStrata textures or derivative archives.
