name: Build the single NeoForge legacy testbed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-testbed.yml'
      - 'mcmodup/legacy_testbed.py'
      - 'mcmodup/__main__.py'
      - 'mcmodup/minechem_pair.py'
      - 'mcmodup/minechem_final_synthesis.py'
      - 'mcmodup/convert.py'
      - 'mcmodup/minechem_reactors.py'
      - 'mcmodup/machines.py'
      - 'mcmodup/catalogs.py'
      - 'mcmodup/source_ports.py'
      - 'mcmodup/icbm_plate.py'
      - 'mcmodup/atomic_thermometer.py'
      - 'mcmodup/geostrata_rocks.py'
      - 'mcmodup/geo_crystals.py'
      - 'mcmodup/templates/minechem/**'
      - 'mcmodup/templates/icbm_plate/**'
      - 'mcmodup/templates/atomic_thermometer/**'
      - 'mcmodup/templates/geostrata_rocks/**'
      - 'tests/legacy_testbed_smoke.py'
      - 'tests/geostrata_client_smoke.py'
      - 'tests/fixtures/GeoConnectedClientSmoke.java'
      - 'tests/test_legacy_testbed.py'
      - 'tests/test_minechem_reactors.py'

permissions:
  contents: read

jobs:
  testbed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the flat JAR contract
        run: |
          python -m unittest discover -s tests -p 'test_legacy_testbed.py' -v
          python -m unittest discover -s tests -p 'test_minechem_reactors.py' -v
      - name: Build and boot the combined production JAR on server and client
        env:
          PYTHONPATH: .:tests
        shell: bash
        run: |
          root="$RUNNER_TEMP/legacy-testbed"
          mkdir "$root"
          download() {
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 3 --max-time 120 --max-filesize "$4" --output "$root/$1" "$2"
            printf '%s  %s\n' "$3" "$root/$1" | sha256sum --check
          }
          download installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.267/neoforge-21.1.267-installer.jar 25bbe66e82205abeccdfd23bdac61e6a8e9ff1333885f3c9f31d392a5ec97e60 12000000
          java -jar "$root/installer.jar" --installServer "$root/server" > "$root/installer.log" 2>&1 || { tail -75 "$root/installer.log"; exit 1; }
          xvfb-run -a python -m legacy_testbed_smoke "$root" --fetch-originals --client
          # Do not publish private-use GeoStrata textures or derivative archives.
